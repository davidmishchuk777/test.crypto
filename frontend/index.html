<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crypto Spread Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>
    <h1>Crypto Spread Scanner</h1>
    <table id="signalsTable">
        <thead>
            <tr>
                <th>Pair</th>
                <th>Buy Exchange</th>
                <th>Buy Price</th>
                <th>Sell Exchange</th>
                <th>Sell Price</th>
                <th>Spread %</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function loadSignals() {
            try {
                const response = await fetch('http://127.0.0.1:8000/signals');
                const data = await response.json();
                const tbody = document.querySelector('#signalsTable tbody');
                tbody.innerHTML = '';
                data.forEach(signal => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${signal.pair}</td>
                        <td>${signal.buy}</td>
                        <td>${signal.buy_price}</td>
                        <td>${signal.sell}</td>
                        <td>${signal.sell_price}</td>
                        <td>${signal.spread}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("Error loading signals:", e);
            }
        }

        // Загружаем сразу и каждые 5 секунд
        loadSignals();
        setInterval(loadSignals, 5000);
    </script>
</body>
</html>
